{% extends 'base.html' %}
{% block content %}
<div class="sec-banner bg0 p-t-80 p-b-50">
		<div class="container">
			<div class="row">
{% for i in subcategories %}
				<div class="col-12 col-sm-6 col-md-4 p-b-30 m-lr-auto">
					<!-- Block1 -->
					<div class="block1 wrap-pic-w">
						<img src="{{i.image.url}}" class="img-fluid" alt="IMG-BANNER" style="height: 600px; object-fit: cover; width: 100%;">

						<a href="{%url 'shop:prod' i.id %}" class="block1-txt ab-t-l s-full flex-col-l-sb p-lr-38 p-tb-34 trans-03 respon3">
							<div class="block1-txt-child1 flex-col-l">
								<span class="block1-name ltext-102 trans-04 p-b-8">
									{{i.name}}
								</span>
<div class="block1-txt-child2 p-b-4 trans-05">
								<div class="block1-link stext-101 cl0 trans-09">
									{{i.description}}
								</div>
							</div>

							</div>

							<div class="block1-txt-child2 p-b-4 trans-05">
								<div class="block1-link stext-101 cl0 trans-09">
									Explore
								</div>
							</div>
						</a>
					</div>
				</div>
{% endfor %}

			</div>

		</div>
	</div>


{% endblock %}
