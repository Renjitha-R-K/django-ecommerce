{% extends 'base.html' %}
{% load static %}


{% block content %}

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-6">



            {% if messages %}
                {% for m in messages %}
                    <div class="alert alert-info">
                        {{ m }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="post">
                {% csrf_token %}
                 Enter otp here
                <input type="text" name="otp" class="form-control border-primary">

                <input type="submit">
            </form>

        </div>
    </div>
</div>

{% endblock %}
